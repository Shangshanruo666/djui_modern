[DJUI_MODERN]
TITLE = "DJUI MODERN"
MENU_ENTRY = "djui_modern设置"
SAVE = "Save"
BACK = "Back"
RESTORE_DEFAULTS = "Restore Defaults"
STATUS_RESTART = "Takes effect after restarting the game"
STATUS_SAVE_FAILED = "Failed to save the configuration file"
STATUS_RESET_FAILED = "Failed to restore defaults"
STATUS_READ_FAILED = "Failed to read the configuration file"
EMOJI_MODERN = "Modern"
EMOJI_VANILLA = "Vanilla"

ENABLED = "Enable Module"
ENABLED_KEY = "enabled"
ENABLED_DESC = "Whether to enable the module."
ENABLED_DEFAULT = "Default: true"

RADIUS_PANEL = "Panel Corner Radius"
RADIUS_PANEL_KEY = "radius_panel"
RADIUS_PANEL_DESC = "Corner radius of large panels in 320x240 DJUI coordinates."
RADIUS_PANEL_DEFAULT = "Default: 12"

RADIUS_ELEMENT = "Control Corner Radius"
RADIUS_ELEMENT_KEY = "radius_element"
RADIUS_ELEMENT_DESC = "Corner radius of regular controls in 320x240 DJUI coordinates."
RADIUS_ELEMENT_DEFAULT = "Default: 8"

CORNER_ROUNDNESS = "Corner Transition Shape"
CORNER_ROUNDNESS_KEY = "corner_roundness"
CORNER_ROUNDNESS_DESC = "Corner shape from 0.0 to 1.0. 1.0 is a circular arc and 0.0 is a clothoid transition."
CORNER_ROUNDNESS_DEFAULT = "Default: 0.90"

PANEL_ALPHA = "Panel Opacity"
PANEL_ALPHA_KEY = "panel_alpha"
PANEL_ALPHA_DESC = "Panel background opacity from 0 to 255."
PANEL_ALPHA_DEFAULT = "Default: 244"

ELEMENT_ALPHA = "Control Opacity"
ELEMENT_ALPHA_KEY = "element_alpha"
ELEMENT_ALPHA_DESC = "Control background opacity from 0 to 255."
ELEMENT_ALPHA_DEFAULT = "Default: 208"

OVERLAY_ALPHA = "Overlay Opacity"
OVERLAY_ALPHA_KEY = "overlay_alpha"
OVERLAY_ALPHA_DESC = "Opacity of Mod entries in the Mod menu and player entry backgrounds in the player list."
OVERLAY_ALPHA_DEFAULT = "Default: 176"

SLIDER_ALPHA = "Slider Opacity"
SLIDER_ALPHA_KEY = "slider_alpha"
SLIDER_ALPHA_DESC = "Slider fill opacity from 0 to 255."
SLIDER_ALPHA_DEFAULT = "Default: 208"

GRADIENTS = "Enable Gradients"
GRADIENTS_KEY = "gradients"
GRADIENTS_DESC = "Apply a subtle top-to-bottom brightness gradient."
GRADIENTS_DEFAULT = "Default: true"

GRADIENT_TOP = "Top Brightness"
GRADIENT_TOP_KEY = "gradient_top_boost"
GRADIENT_TOP_DESC = "Brightness multiplier at the top edge of a gradient."
GRADIENT_TOP_DEFAULT = "Default: 1.18"

GRADIENT_BOTTOM = "Bottom Brightness"
GRADIENT_BOTTOM_KEY = "gradient_bottom_scale"
GRADIENT_BOTTOM_DESC = "Brightness multiplier at the bottom edge of a gradient."
GRADIENT_BOTTOM_DEFAULT = "Default: 0.86"

SHOW_BORDERS = "Show Borders"
SHOW_BORDERS_KEY = "show_borders"
SHOW_BORDERS_DESC = "Draw rounded borders around controls and panels."
SHOW_BORDERS_DEFAULT = "Default: true"

FONT_ENABLED = "Enable Vector Fonts"
FONT_ENABLED_KEY = "font_enabled"
FONT_ENABLED_DESC = "Use TTF or OTF fonts instead of the original bitmap fonts."
FONT_ENABLED_DEFAULT = "Default: true"

FONT_PATH = "Custom Font Path"
FONT_PATH_KEY = "font_path"
FONT_PATH_DESC = "Path to a custom font file. An empty value searches the game directories automatically."
FONT_PATH_DEFAULT = "Default: empty (automatic lookup)"

FONT_CJK_BOOST = "CJK Raster Scale"
FONT_CJK_BOOST_KEY = "font_cjk_raster_boost"
FONT_CJK_BOOST_DESC = "CJK glyph raster size multiplier. Higher values increase sharpness and memory use."
FONT_CJK_BOOST_DEFAULT = "Default: 1.00"

FONT_BILINEAR = "Bilinear Glyph Filtering"
FONT_BILINEAR_KEY = "font_bilinear"
FONT_BILINEAR_DESC = "Use bilinear filtering for glyph textures."
FONT_BILINEAR_DEFAULT = "Default: true"

FONT_NATIVE_METRICS = "Native Font Metrics"
FONT_NATIVE_METRICS_KEY = "font_native_metrics"
FONT_NATIVE_METRICS_DESC = "Use native font metrics instead of the original bitmap font widths."
FONT_NATIVE_METRICS_DEFAULT = "Default: true"

FONT_FALLBACK_KERNING = "Fallback Kerning"
FONT_FALLBACK_KERNING_KEY = "font_fallback_kerning"
FONT_FALLBACK_KERNING_DESC = "Use the built-in kerning table when the font has no kerning data."
FONT_FALLBACK_KERNING_DEFAULT = "Default: false"

FONT_SLOTS = "Custom Font Slots"
FONT_SLOTS_KEY = "font_slots"
FONT_SLOTS_DESC = "Choose which font slots use custom fonts: Normal, Title, HUD, Aliased, CustomHUD, RecolorHUD, and Special."
FONT_SLOTS_DEFAULT = "Default: Normal and Aliased"

EMOJI = "Emoji Style"
EMOJI_KEY = "emoji"
EMOJI_DESC = "Use the embedded color Emoji and flag atlas or the original Emoji sprites."
EMOJI_DEFAULT = "Default: modern"

TEXT_SCALE = "Glyph Raster Scale"
TEXT_SCALE_KEY = "text_scale"
TEXT_SCALE_DESC = "Global glyph raster scale from 0.5 to 2.0. Layout size is unchanged."
TEXT_SCALE_DEFAULT = "Default: 1.00"

FONT_PLAYER_LIST = "Vector Font in Player List"
FONT_PLAYER_LIST_KEY = "font_player_list"
FONT_PLAYER_LIST_DESC = "Use vector fonts in the player list."
FONT_PLAYER_LIST_DEFAULT = "Default: false"

FONT_MOD_DESCRIPTION = "Vector Font in Mod Descriptions"
FONT_MOD_DESCRIPTION_KEY = "font_mod_description"
FONT_MOD_DESCRIPTION_DESC = "Use vector fonts in the mod list and mod description panel."
FONT_MOD_DESCRIPTION_DEFAULT = "Default: false"

SHOW_STATS = "Show Render Statistics"
SHOW_STATS_KEY = "show_stats"
SHOW_STATS_DESC = "Write rectangle, font, and display list diagnostics to the log."
SHOW_STATS_DEFAULT = "Default: false"
